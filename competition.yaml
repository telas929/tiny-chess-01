limits:
  cpus: 1
  memory_mb: 512
  pids: 64
  wall_budget_sec: 1800

# The efficiency view's authorship gate (bot-01's 0.80): no prize rides on that view.
min_authored_coverage: 0.8

# A placement prize needs a mean Elo above every published house baseline's (agent/sunfish-4k) with the 90%
# paired t-interval of the per-instance lead above 0 (server/payouts/baseline.ts): an entry that does not
# beat it keeps its rank but is not prize-eligible. The rules text quotes it.
prize_requires_beating_baseline: true

# A house entry that beats the baseline holds the place it finishes in, unpaid, and no entry moves up (the gate
# baseline never beats itself, so it never holds one); the Prizes section says so.
house_holds_places: true

# Open (the header): the automation jobs lock it at its deadline, grade its final phase, publish and
# resolve it; payouts auto keeps it off the escrow (the house pays on the manual rail).
automation:
  lifecycle: true
  payouts: auto
